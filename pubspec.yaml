name: pulsso
description: "Pulssó: app para enseñar geometría a niños invidentes con voz, vibración y gestos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Manejo de estado (no se usa setState ni ValueNotifier)
  provider: ^6.1.2

  # Modo accesible: voz, vibración y sensores
  flutter_tts: ^4.2.0
  vibration: ^3.1.0
  sensors_plus: ^7.0.0

  # Tema, tipografía y preferencias locales
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.3

  # Menú circular para cambiar el tema (el mismo que en clase)
  circular_menu: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
