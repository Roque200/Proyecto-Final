name: pulsso
description: "Pulssó: app para enseñar geometría a niños invidentes con voz, vibración y gestos."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Manejo de estado (no se usa setState ni ValueNotifier)
  provider: ^6.1.2

  # Modo accesible: voz, vibración y sensores
  flutter_tts: ^4.2.0
  vibration: ^3.1.0
  sensors_plus: ^7.0.0

  # Preferencias locales (tema y onboarding)
  shared_preferences: ^2.3.3

  # Menú circular para cambiar el tema (el mismo que en clase)
  circular_menu: ^4.0.0
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Tipografía local: funciona sin internet desde el primer arranque.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Black.ttf
          weight: 900